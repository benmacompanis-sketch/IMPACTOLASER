<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" fill="none">
  <!--
    PLACEHOLDER recreation of the IMPACTO LÁSER wordmark.
    Replace public/logo.svg (or drop public/logo.png and switch LOGO_SRC
    in src/components/brand/logo.tsx) with the OFFICIAL delivered logo.
  -->
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7faff"/>
      <stop offset="34%" stop-color="#ffffff"/>
      <stop offset="56%" stop-color="#9fabbd"/>
      <stop offset="74%" stop-color="#e9eff8"/>
      <stop offset="100%" stop-color="#8893a6"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ec8ff"/>
      <stop offset="45%" stop-color="#3d8eff"/>
      <stop offset="100%" stop-color="#1656bf"/>
    </linearGradient>
    <radialGradient id="burst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="22%" stop-color="#cfe4ff"/>
      <stop offset="55%" stop-color="#3d8eff"/>
      <stop offset="100%" stop-color="#3d8eff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3d8eff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9ec8ff"/>
      <stop offset="100%" stop-color="#3d8eff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- horizontal laser light-streak -->
  <rect x="120" y="296" width="1040" height="3" fill="url(#streak)" opacity="0.9"/>
  <rect x="120" y="296" width="1040" height="10" fill="url(#streak)" opacity="0.35" filter="url(#soft)"/>

  <!-- IMPACTO -->
  <text x="70" y="250" font-family="'Arial Black', Arial, Helvetica, sans-serif" font-weight="900"
        font-style="italic" font-size="170" letter-spacing="2" fill="url(#metal)">IMPACTO</text>

  <!-- laser burst over the final letters -->
  <g transform="translate(1015 150)">
    <circle r="120" fill="url(#burst)" filter="url(#glow)" opacity="0.95"/>
    <g fill="#eaf3ff" filter="url(#soft)">
      <path d="M0 -150 L10 0 L0 150 L-10 0 Z"/>
      <path d="M-150 0 L0 -9 L150 0 L0 9 Z"/>
      <path d="M-92 -92 L6 -3 L92 92 L-6 3 Z" opacity="0.7"/>
      <path d="M92 -92 L3 6 L-92 92 L-3 -6 Z" opacity="0.7"/>
    </g>
    <circle r="14" fill="#ffffff"/>
  </g>

  <!-- LÁSER -->
  <text x="690" y="392" font-family="'Arial Black', Arial, Helvetica, sans-serif" font-weight="900"
        font-style="italic" font-size="118" letter-spacing="10" fill="url(#blue)">L&#193;SER</text>

  <!-- tagline -->
  <text x="694" y="450" font-family="Arial, Helvetica, sans-serif" font-style="italic"
        font-size="34" letter-spacing="1" fill="#aebbce">Limpieza y restauración sin dañar superficies</text>
</svg>
